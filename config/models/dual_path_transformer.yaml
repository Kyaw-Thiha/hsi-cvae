model:
  architecture: dual_path_transformer
  latent_dim: 128
  condition_dropout: 0.15
  dual_path_transformer_params:
    d_model: 256
    n_heads: 8
    encoder_layers: 6
    decoder_layers: 2
    dropout: 0.0
    latent_fuse_weight: 0.1
    latent_fuse_weight_learnable: true
    gated_film_init: 0.1
