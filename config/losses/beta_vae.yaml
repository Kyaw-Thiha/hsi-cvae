model:
  loss_name: beta_vae
  lr: 0.0002
  loss_params:
    # Beta-VAE Loss Params
    recon: mse
    beta: 0.05
    free_bits_total: 2.0

    # Wavelength Dataset & Masking params
    masked_wavelength_ranges_nm:
      - [1700, 1900]
    masked_wavelength_weight: 0.1
    wavelength_start_nm: 400
    wavelength_step_nm: 10

    # KL annealing
    kl_anneal: true
    kl_anneal_mode: linear
    kl_anneal_start: 0.0
    kl_anneal_warmup_ratio: 0.5

    # Gradient-based loss params
    grad_weight: 8.0
    grad_metric: mse
    grad_diff_orders: [1, 2]
    grad_order_weights: [1.0, 0.1]
